<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitransit Kartta</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.vectorgrid@latest/dist/Leaflet.VectorGrid.min.js"></script>
    <script src="leaflet.canvas-markers.js"></script>


    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([65.322, 26.844], 10);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // Nyt haetaan vektoritiilet turvallisesti palvelimen kautta!
        const vectorTileLayer = L.vectorGrid.protobuf(
            "/api/map-tiles/{z}/{x}/{y}.pbf",
            {
                        vectorTileLayerStyles: {
                            stops: {
                                fill: true,
                                fillColor: 'blue',
                                fillOpacity: 0.6,
                                stroke: true,
                                color: 'black',
                                weight: 1
                            },
                            stations: {
                                fill: true,
                                fillColor: 'red',
                                fillOpacity: 0.7,
                                stroke: true,
                                color: 'black',
                                weight: 1
                            }
                        },
                        interactive: true
                    }
                );

        vectorTileLayer.addTo(map);

        vectorTileLayer.on('click', function(e) {
        if (!e.layer || !e.layer.properties) {
            console.warn("Klikattu elementti ei sisällä tietoja.", e);
            return;
        }
        var stopId = e.layer.properties.id || "Tuntematon ID";
        console.log("Pysäkin ID:", stopId);
        alert(`Pysäkin ID: ${stopId}`);
        });


    </script>
</body>
</html>
