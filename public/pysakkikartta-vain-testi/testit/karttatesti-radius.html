<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>


    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; cursor: pointer; }
        </style>
</head>
<body>
    <div id="map"></div>
</body>
    <script>
        var map = L.map('map').setView([65.322, 26.844], 5);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);


        var currentMarker = null; // muuttuja johon tallennetaan ympyrä
        var currentCoordinates = null;
        
        // kun klikataan karttaa, asetetaan merkki ja otetaan koordinaatit ylös
        map.on('click', function(e) {
            // poistetaan vanha ympyrä jos sellainen on
            if (currentMarker) {
                map.removeLayer(currentMarker);
            }

            // lisätään uusi marker
            currentMarker = L.marker(e.latlng).addTo(map);

            // tallenetaan koordinaatit
            currentCoordinates = e.latlng;
            console.log('Klikatun kohdan koordinaatit:', currentCoordinates);
        });
    </script>
</html>
