<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitransit Kartta</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-canvas-marker@0.2.0"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([65.322, 26.844], 10);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        var ciLayer = L.canvasIconLayer({}).addTo(map);

        var icon = L.icon({
            iconUrl: './pysakki.png',
            iconSize: [30, 30],
            iconAnchor: [15, 15]
        });

        async function fetchStops() {
            try {
                const response = await fetch('/api/all-stops');
                const stops = await response.json();
                return stops;
            } catch (error) {
                console.error("Virhe ladattaessa pysäkkitietoja:", error);
                return [];
            }
        }

        async function addStopsToMap() {
            const stops = await fetchStops();
            let markers = [];
            
            stops.forEach(stop => {
                var marker = L.marker([stop.lat, stop.lon], {icon: icon}).bindPopup(`Nimi: ${stop.name}, ID: ${stop.gtfsId} (Zone: ${stop.zoneId})`);
                marker.mydata = {
                    name: stop.name,
                    gtfsId: stop.gtfsId,
                    zoneId: stop.zoneId
                };
                markers.push(marker);
            });
            
            ciLayer.addLayers(markers);
        }

        ciLayer.addOnClickListener(function (e, data) {
            const clickedData = data[0].data.mydata;
            console.log(`Klikattu pysäkki: ${clickedData.name}, ID: ${clickedData.gtfsId}, Zone: ${clickedData.zoneId}`);
        });
        
        addStopsToMap();
    </script>
</body>
</html>
